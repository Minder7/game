<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📍 موقعي</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #050510;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* ========== شاشة الترحيب ========== */
        .welcome-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, #0a0a20 0%, #050510 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .welcome-screen.hidden {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        .welcome-icon {
            font-size: 80px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.4));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .welcome-title {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .welcome-sub {
            font-size: 15px;
            color: #888;
            text-align: center;
            max-width: 280px;
            line-height: 1.7;
        }

        .welcome-btn {
            background: linear-gradient(135deg, #00d4ff, #0066cc);
            border: none;
            color: #fff;
            padding: 16px 55px;
            border-radius: 35px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 30px rgba(0, 212, 255, 0.4);
            transition: all 0.3s;
            margin-top: 10px;
        }

        .welcome-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 15px rgba(0, 212, 255, 0.3);
        }

        /* ========== الخريطة ========== */
        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
            opacity: 0;
            transition: opacity 1s ease;
        }

        #map.visible {
            opacity: 1;
        }

        /* ========== البطاقة العلوية (بس اسم المكان) ========== */
        .location-card {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            background: rgba(5, 5, 16, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 18px 20px;
            z-index: 1000;
            border: 1px solid rgba(0, 212, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            max-width: 500px;
            margin: 0 auto;
            transform: translateY(-120%);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .location-card.show {
            transform: translateY(0);
        }

        .location-card .label {
            font-size: 11px;
            color: #00d4ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .location-card .place-name {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            line-height: 1.4;
        }

        .location-card .area-name {
            font-size: 13px;
            color: #aaa;
            margin-top: 4px;
        }

        .location-card .loading-text {
            color: #888;
            font-style: italic;
            font-size: 14px;
        }

        .accuracy-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .accuracy-pill.gps {
            background: rgba(0, 255, 136, 0.12);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.25);
        }

        .accuracy-pill.ip {
            background: rgba(255, 170, 0, 0.12);
            color: #ffaa00;
            border: 1px solid rgba(255, 170, 0, 0.25);
        }

        .pill-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .accuracy-pill.gps .pill-dot { background: #00ff88; box-shadow: 0 0 8px #00ff88; }
        .accuracy-pill.ip .pill-dot { background: #ffaa00; box-shadow: 0 0 8px #ffaa00; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        /* ========== زر تحسين الدقة ========== */
        .refine-btn {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            z-index: 1000;
            background: linear-gradient(135deg, #00d4ff, #0066cc);
            border: none;
            color: #fff;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 25px rgba(0, 212, 255, 0.3);
            transition: all 0.4s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .refine-btn.show {
            transform: translateX(-50%) translateY(0);
        }

        .refine-btn:active { transform: translateX(-50%) scale(0.95); }
        .refine-btn.hidden { display: none; }

        /* ========== خطأ ========== */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255, 71, 87, 0.95);
            color: #fff;
            padding: 12px 22px;
            border-radius: 15px;
            font-size: 13px;
            z-index: 1002;
            opacity: 0;
            transition: all 0.4s;
            text-align: center;
            max-width: 90%;
            backdrop-filter: blur(10px);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ========== Leaflet ========== */
        .leaflet-control-zoom {
            border-radius: 15px !important;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3) !important;
        }

        .leaflet-control-zoom a {
            background: rgba(5, 5, 16, 0.9) !important;
            color: #fff !important;
            border-color: rgba(0,212,255,0.2) !important;
            width: 42px !important;
            height: 42px !important;
            line-height: 42px !important;
            font-size: 20px !important;
        }

        .leaflet-popup-content-wrapper {
            background: rgba(5, 5, 16, 0.95);
            color: #fff;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .leaflet-popup-tip {
            background: rgba(5, 5, 16, 0.95);
        }
    </style>
</head>
<body>

    <!-- ========== شاشة الترحيب ========== -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-icon">🌍</div>
        <div class="welcome-title">مرحباً بك</div>
        <div class="welcome-sub">
            اضغط على "أهلاً" لبدء تجربة استكشاف موقعك الحالي على الخريطة
        </div>
        <button class="welcome-btn" id="welcomeBtn" onclick="startExperience()">
            أهلاً 👋
        </button>
    </div>

    <!-- ========== البطاقة العلوية ========== -->
    <div class="location-card" id="locCard">
        <div class="label">📍 أنت الآن في</div>
        <div class="place-name loading-text" id="placeName">جاري تحديد الموقع...</div>
        <div class="area-name" id="areaName"></div>
        <div class="accuracy-pill ip" id="accPill">
            <div class="pill-dot"></div>
            <span id="accText">موقع تقريبي</span>
        </div>
    </div>

    <!-- ========== الخريطة ========== -->
    <div id="map"></div>

    <!-- ========== زر تحسين الدقة ========== -->
    <button class="refine-btn" id="refineBtn" onclick="getAccurateGPS()">
        🎯 دقة أعلى
    </button>

    <!-- ========== Toast ========== -->
    <div class="toast" id="toast"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map, marker, circle, watchId;
        let hasAccurateGPS = false;
        let currentLat = null, currentLng = null;

        const welcomeScreen = document.getElementById('welcomeScreen');
        const welcomeBtn = document.getElementById('welcomeBtn');
        const mapEl = document.getElementById('map');
        const locCard = document.getElementById('locCard');
        const placeName = document.getElementById('placeName');
        const areaName = document.getElementById('areaName');
        const accPill = document.getElementById('accPill');
        const accText = document.getElementById('accText');
        const refineBtn = document.getElementById('refineBtn');
        const toast = document.getElementById('toast');

        // ========== لما يدوس "أهلاً" ==========
        function startExperience() {
            welcomeBtn.innerHTML = "⏳ جاري التحميل...";
            welcomeBtn.disabled = true;

            // نجرب GPS أولًا (لو سمحتله قبل كده هيشتغل على طول)
            tryGPSFirst();
        }

        // ========== تهيئة الخريطة ==========
        function initMap(lat, lng, zoom, accuracy) {
            if (!map) {
                map = L.map('map', { zoomControl: false, attributionControl: false });
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    maxZoom: 22, subdomains: 'abcd'
                }).addTo(map);
                L.control.zoom({ position: 'bottomright' }).addTo(map);
            }

            map.setView([lat, lng], zoom);

            const icon = L.divIcon({
                className: 'custom-marker',
                html: `<div style="width:26px;height:26px;background:#00d4ff;border:3px solid #fff;border-radius:50%;box-shadow:0 0 20px rgba(0,212,255,0.7),0 0 40px rgba(0,212,255,0.3);"></div>`,
                iconSize: [26, 26], iconAnchor: [13, 13]
            });

            if (marker) { marker.setLatLng([lat, lng]); }
            else { marker = L.marker([lat, lng], { icon }).addTo(map); }

            if (circle) {
                circle.setLatLng([lat, lng]);
                circle.setRadius(accuracy);
            } else {
                circle = L.circle([lat, lng], {
                    radius: accuracy, color: '#00d4ff',
                    fillColor: '#00d4ff', fillOpacity: 0.12, weight: 1.5
                }).addTo(map);
            }
        }

        // ========== تحديث البطاقة ==========
        function updateCard(lat, lng, accuracy, isGPS) {
            currentLat = lat;
            currentLng = lng;

            if (isGPS && !hasAccurateGPS) {
                hasAccurateGPS = true;
                accPill.className = 'accuracy-pill gps';
                accText.textContent = `دقة عالية ±${Math.round(accuracy)}م`;
                refineBtn.classList.remove('show');
                setTimeout(() => refineBtn.classList.add('hidden'), 400);
                startWatching();
            } else if (!isGPS) {
                accText.textContent = `تقريبي ~${Math.round(accuracy/1000)}كم`;
            }

            fetchAddress(lat, lng);
        }

        // ========== جلب العنوان ==========
        async function fetchAddress(lat, lng) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=ar`, {
                    headers: { 'User-Agent': 'MyLocationApp/1.0' }
                });
                const data = await res.json();

                if (data.display_name) {
                    const parts = data.display_name.split(', ');

                    // اسم المكان/الشارع
                    const place = parts[0] || 'موقع غير معروف';
                    // المنطقة/المدينة
                    const area = parts.slice(1, 3).join('، ') || '';

                    placeName.textContent = place;
                    placeName.classList.remove('loading-text');
                    areaName.textContent = area;
                }
            } catch (e) {
                placeName.textContent = "تعذر تحديد العنوان";
            }
        }

        // ========== 1. جرب GPS أولًا ==========
        function tryGPSFirst() {
            if (!navigator.geolocation) {
                // مفيش GPS خالص → روح IP على طول
                getIPLocation();
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    // ✅ GPS اشتغل! (إما لأنه مسموح قبل كده، أو المستخدم وافق دلوقتي)
                    const { latitude, longitude, accuracy } = pos.coords;
                    showMap(latitude, longitude, 18, accuracy, true);
                },
                (err) => {
                    // ❌ GPS فشل (رفض أو مش متاح) → IP fallback
                    getIPLocation();
                },
                { enableHighAccuracy: true, timeout: 6000, maximumAge: 300000 }
            );
        }

        // ========== 2. IP Location ==========
        async function getIPLocation() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();

                if (data.latitude && data.longitude) {
                    const accuracy = data.city ? 3000 : 10000;
                    showMap(data.latitude, data.longitude, 13, accuracy, false);
                    // نظهر زر "دقة أعلى" عشان المستخدم يقدر يحسن لو عايز
                    setTimeout(() => refineBtn.classList.add('show'), 800);
                } else {
                    throw new Error('No data');
                }
            } catch (e) {
                // Fallback: القاهرة
                showMap(30.0444, 31.2357, 12, 20000, false);
                setTimeout(() => refineBtn.classList.add('show'), 800);
                showToast("تعذر تحديد الموقع تلقائيًا");
            }
        }

        // ========== عرض الخريطة ==========
        function showMap(lat, lng, zoom, accuracy, isGPS) {
            // إخفاء الترحيب
            welcomeScreen.classList.add('hidden');
            
            // إظهار الخريطة
            mapEl.classList.add('visible');
            
            // تهيئة
            initMap(lat, lng, zoom, accuracy);
            updateCard(lat, lng, accuracy, isGPS);
            
            // إظهار البطاقة
            setTimeout(() => locCard.classList.add('show'), 300);
        }

        // ========== زر "دقة أعلى" ==========
        function getAccurateGPS() {
            if (!navigator.geolocation) {
                showToast("المتصفح لا يدعم GPS");
                return;
            }

            refineBtn.innerHTML = "⏳ جاري التحميل...";

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const { latitude, longitude, accuracy } = pos.coords;
                    initMap(latitude, longitude, 18, accuracy);
                    updateCard(latitude, longitude, accuracy, true);
                    map.flyTo([latitude, longitude], 18, { duration: 1.5 });
                },
                (err) => {
                    refineBtn.innerHTML = "🎯 دقة أعلى";
                    let msg = "❌ لازم تسمح بالوصول للموقع من إعدادات المتصفح";
                    if (err.code === 2) msg = "❌ تعذر الوصول للـ GPS";
                    if (err.code === 3) msg = "⏱️ الـ GPS بطيء، جرب في مكان مفتوح";
                    showToast(msg);
                },
                { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
            );
        }

        // ========== تتبع مستمر ==========
        function startWatching() {
            if (watchId) return;
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const { latitude, longitude, accuracy } = pos.coords;
                    if (marker) {
                        marker.setLatLng([latitude, longitude]);
                        circle.setLatLng([latitude, longitude]);
                        circle.setRadius(accuracy);
                    }
                    if (map) map.panTo([latitude, longitude], { animate: true, duration: 0.5 });
                    accText.textContent = `دقة عالية ±${Math.round(accuracy)}م`;
                    fetchAddress(latitude, longitude);
                },
                () => {},
                { enableHighAccuracy: true, maximumAge: 0 }
            );
        }

        // ========== Toast ==========
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 5000);
        }
    </script>
</body>
</html>
