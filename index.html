<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>غرف النيون + لعبة التخمين</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-purple: #b026ff;
            --neon-blue: #00f3ff;
            --neon-pink: #ff2d95;
            --neon-green: #39ff14;
            --neon-yellow: #fff01f;
            --dark-bg: #060814;
            --card-bg: rgba(20, 20, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.5); }
        * { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.3) rgba(255, 255, 255, 0.05); }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(176, 38, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.15) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            color: white;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(176, 38, 255, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 500px;
            height: 100vh;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #login-screen { padding: 2rem; display: flex; flex-direction: column; justify-content: center; height: 100%; text-align: center; }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .subtitle { color: rgba(255,255,255,0.6); margin-bottom: 2rem; font-size: 0.9rem; }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus { outline: none; border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); }

        .btn { width: 100%; padding: 14px; margin: 10px 0; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s ease; }
        .btn-primary { background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink)); color: white; box-shadow: 0 4px 15px rgba(176, 38, 255, 0.4); }
        .btn-success { background: linear-gradient(135deg, var(--neon-blue), var(--neon-green)); color: var(--dark-bg); box-shadow: 0 4px 15px rgba(0, 243, 255, 0.4); }
        .btn:active { transform: scale(0.97); }
        .error-msg { color: var(--neon-pink); font-size: 14px; margin-top: 10px; min-height: 20px; text-shadow: 0 0 5px rgba(255, 45, 149, 0.5); }

        #room-screen { display: none; flex-direction: column; height: 100%; }

        .chat-header {
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; flex-wrap: wrap; }
        .room-title { font-weight: 700; color: var(--neon-blue); white-space: nowrap; font-size: 15px; }

        .game-status-header {
            font-size: 11px;
            color: var(--neon-yellow);
            background: rgba(255, 240, 31, 0.1);
            border: 1px solid rgba(255, 240, 31, 0.3);
            padding: 4px 10px;
            border-radius: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
            display: none;
        }
        .game-status-header.active { display: inline-block; }

        .timer-display {
            font-size: 13px;
            font-weight: 900;
            color: var(--neon-pink);
            background: rgba(255, 45, 149, 0.15);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 45, 149, 0.3);
            font-variant-numeric: tabular-nums;
            display: none;
        }
        .timer-display.active { display: inline-block; }

        .leave-btn {
            background: rgba(255, 45, 149, 0.2);
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }
        .leave-btn:hover { background: var(--neon-pink); color: white; }

        .members-bar {
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.15);
            border-bottom: 1px solid var(--glass-border);
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            gap: 8px;
        }

        .member-card {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(57, 255, 20, 0.08);
            border: 1px solid rgba(57, 255, 20, 0.4);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            color: var(--neon-green);
            animation: popIn 0.3s ease;
            flex-shrink: 0;
            position: relative;
        }
        .member-card.you { background: rgba(176, 38, 255, 0.15); border-color: var(--neon-purple); color: white; }
        .member-card.describer {
            background: rgba(255, 240, 31, 0.15);
            border-color: var(--neon-yellow);
            color: var(--neon-yellow);
            animation: pulseGlow 2s infinite;
        }
        .member-card.describer::after {
            content: '🎤';
            position: absolute;
            top: -8px;
            left: -8px;
            font-size: 14px;
            background: var(--dark-bg);
            border-radius: 50%;
            padding: 2px;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .member-name { font-weight: 600; }
        .member-score {
            background: rgba(57, 255, 20, 0.25);
            padding: 2px 10px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 13px;
            border: 1px solid rgba(57, 255, 20, 0.5);
            color: var(--neon-green);
            min-width: 28px;
            text-align: center;
        }
        .member-card.you .member-score { background: rgba(176, 38, 255, 0.3); border-color: var(--neon-purple); color: white; }
        .member-card.describer .member-score { background: rgba(255, 240, 31, 0.25); border-color: var(--neon-yellow); color: var(--neon-yellow); }

        #secret-word-banner {
            display: none;
            padding: 8px 15px;
            background: linear-gradient(135deg, rgba(255, 240, 31, 0.15), rgba(255, 153, 0, 0.15));
            border-bottom: 2px dashed var(--neon-yellow);
            text-align: center;
        }
        #secret-word-banner.active { display: block; }
        .secret-word-small { font-size: 14px; color: rgba(255,255,255,0.7); display: inline-block; }
        .secret-word-small strong {
            font-size: 18px;
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
            margin-right: 6px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            animation: slideUp 0.3s ease;
            word-wrap: break-word;
        }
        .message .sender-name { font-size: 11px; font-weight: 700; margin-bottom: 4px; opacity: 0.8; }
        .message.other { align-self: flex-start; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); border-bottom-right-radius: 4px; color: #e0e0e0; }
        .message.other .sender-name { color: var(--neon-blue); }
        .message.mine { align-self: flex-end; background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink)); border-bottom-left-radius: 4px; color: white; box-shadow: 0 4px 15px rgba(176, 38, 255, 0.3); }
        .message.mine .sender-name { color: rgba(255,255,255,0.8); text-align: left; }
        .message-time { font-size: 10px; opacity: 0.6; text-align: left; margin-top: 4px; }

        .system-msg {
            align-self: center;
            font-size: 12px;
            color: var(--neon-yellow);
            background: rgba(255, 240, 31, 0.1);
            border: 1px solid rgba(255, 240, 31, 0.3);
            padding: 6px 14px;
            border-radius: 12px;
            margin: 5px 0;
            font-weight: 600;
            text-align: center;
            max-width: 90%;
        }

        .correct-guess-msg {
            align-self: center;
            font-size: 14px;
            color: var(--dark-bg);
            background: var(--neon-green);
            padding: 8px 16px;
            border-radius: 12px;
            margin: 5px 0;
            font-weight: 900;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 20px var(--neon-green);
            text-align: center;
        }

        .chat-input-area {
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .chat-input-area input { margin: 0; flex: 1; border-radius: 25px; padding: 12px 18px; font-size: 14px; }
        .send-btn {
            width: 45px; height: 45px; border-radius: 50%; border: none;
            background: var(--neon-blue); color: var(--dark-bg); font-size: 20px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: 0.3s; box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            flex-shrink: 0;
        }
        .send-btn:active { transform: scale(0.9); }

        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 240, 31, 0.4); } 50% { box-shadow: 0 0 15px 2px rgba(255, 240, 31, 0.3); } }

        @media (max-width: 480px) {
            .container { height: 100vh; max-height: 100vh; border-radius: 0; border: none; }
            body { padding: 0; }
            .chat-header { padding: 10px; gap: 8px; }
            .room-title { font-size: 14px; }
            .game-status-header { font-size: 10px; max-width: 140px; padding: 3px 8px; }
            .message { max-width: 85%; font-size: 13px; }
            .chat-input-area input { font-size: 14px; padding: 10px 15px; }
            .member-card { padding: 6px 10px; font-size: 12px; }
            .member-score { font-size: 12px; padding: 2px 8px; }
        }
        @media (min-width: 481px) and (max-width: 768px) { .container { height: 95vh; max-height: 800px; } }
        @media (min-width: 769px) { body { padding: 15px; } .container { height: 90vh; max-height: 850px; } }
    </style>
</head>
<body>

    <div class="container">
        <div id="login-screen">
            <h1>⚡ غرف النيون</h1>
            <p class="subtitle">دردشة مباشرة + لعبة تخمين تلقائية</p>
            <input type="text" id="username" placeholder="اسمك المستعار" autocomplete="off">
            <input type="text" id="room-id" placeholder="رقم الروم (مثال: 777)" autocomplete="off">
            <button class="btn btn-success" id="create-btn">🚀 ابدأ روم جديدة</button>
            <button class="btn btn-primary" id="join-btn">🚪 ادخل روم موجودة</button>
            <p class="error-msg" id="error-msg"></p>
        </div>

        <div id="room-screen">
            <div class="chat-header">
                <div class="header-left">
                    <div class="room-title">غرفة #<span id="display-room-id"></span></div>
                    <div class="game-status-header" id="game-status-header"></div>
                    <div class="timer-display" id="timer-display">60</div>
                </div>
                <button class="leave-btn" id="leave-btn">مغادرة</button>
            </div>

            <div class="members-bar" id="members-bar"></div>

            <div id="secret-word-banner">
                <div class="secret-word-small">
                    🎯 الكلمة التي تصفها: <strong id="secret-word">طائرة</strong>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages"></div>

            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="اكتب رسالتك أو تخمينك هنا..." autocomplete="off">
                <button class="send-btn" id="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { 
            getDatabase, ref, set, onValue, remove, onDisconnect, get, 
            push, query, orderByChild, limitToLast, update, runTransaction
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBT-WCUAI7QO2IlcF3eQlJOSrTOQN_52vU",
            authDomain: "pcon-f6efd.firebaseapp.com",
            databaseURL: "https://pcon-f6efd-default-rtdb.firebaseio.com",
            projectId: "pcon-f6efd",
            storageBucket: "pcon-f6efd.firebasestorage.app",
            messagingSenderId: "971596240948",
            appId: "1:971596240948:web:247696d61e6b61e721d261",
            measurementId: "G-XH6LZ3Z716"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getDatabase(app);

        let currentRoom = null;
        let currentUserId = null;
        let currentUserName = null;
        let currentGameState = null;
        let messagesUnsubscribe = null;
        let usersUnsubscribe = null;
        let gameUnsubscribe = null;
        let timerInterval = null;

        const gameWords = [
            "طائرة", "سيارة", "أسد", "نمر", "فيل", "زرافة", "قلم", "كتاب", "هاتف", "حاسوب",
            "ساعة", "تفاح", "موز", "برتقال", "بحر", "جبل", "نهر", "شمس", "قمر", "نجمة",
            "باب", "شباك", "كرسي", "طاولة", "سرير", "ثلاجة", "تلفزيون", "قطة", "كلب", "عصفور",
            "سمكة", "دراجة", "حافلة", "قطار", "سفينة", "صاروخ", "روبوت", "فضاء", "كوكب", "مدرسة"
        ];

        function generateUserId() { return 'user_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now(); }

        //  دالة تنظيف النص للمقارنة (مهمة جداً!)
        function normalizeText(text) {
            return text.trim().toLowerCase().replace(/\s+/g, ' ');
        }

        const loginScreen = document.getElementById('login-screen');
        const roomScreen = document.getElementById('room-screen');
        const usernameInput = document.getElementById('username');
        const roomIdInput = document.getElementById('room-id');
        const errorMsg = document.getElementById('error-msg');
        const messageInput = document.getElementById('message-input');
        const chatMessages = document.getElementById('chat-messages');
        const membersBar = document.getElementById('members-bar');
        const gameStatusHeader = document.getElementById('game-status-header');
        const timerDisplay = document.getElementById('timer-display');
        const secretWordBanner = document.getElementById('secret-word-banner');
        const secretWordEl = document.getElementById('secret-word');

        document.getElementById('create-btn').addEventListener('click', async () => {
            if (!validateInput()) return;
            currentRoom = roomIdInput.value.trim();
            currentUserName = usernameInput.value.trim();
            currentUserId = generateUserId();
            await enterRoom();
        });

        document.getElementById('join-btn').addEventListener('click', async () => {
            if (!validateInput()) return;
            const roomId = roomIdInput.value.trim();
            const snapshot = await get(ref(db, `rooms/${roomId}`));
            if (snapshot.exists()) {
                currentRoom = roomId;
                currentUserName = usernameInput.value.trim();
                currentUserId = generateUserId();
                await enterRoom();
            } else {
                errorMsg.textContent = '❌ هذه الروم غير موجودة. تأكد من الرقم أو ابدأ روم جديدة.';
            }
        });

        function validateInput() {
            if (!usernameInput.value.trim() || !roomIdInput.value.trim()) {
                errorMsg.textContent = '⚠️ يرجى إدخال الاسم ورقم الروم';
                return false;
            }
            errorMsg.textContent = '';
            return true;
        }

        async function enterRoom() {
            loginScreen.style.display = 'none';
            roomScreen.style.display = 'flex';
            document.getElementById('display-room-id').textContent = currentRoom;

            const userRef = ref(db, `rooms/${currentRoom}/users/${currentUserId}`);
            await set(userRef, { name: currentUserName, joinedAt: Date.now() });
            onDisconnect(userRef).remove();

            // الاستماع للأعضاء
            usersUnsubscribe = onValue(ref(db, `rooms/${currentRoom}/users`), async (snapshot) => {
                const users = snapshot.val();
                renderMembers(users);
                if (users && Object.keys(users).length >= 2) {
                    const gameSnap = await get(ref(db, `rooms/${currentRoom}/game`));
                    if (!gameSnap.exists() || !gameSnap.val().isActive) {
                        await startGameAuto(users);
                    }
                }
            });

            // الاستماع للرسائل
            const messagesRef = query(ref(db, `rooms/${currentRoom}/messages`), orderByChild('timestamp'), limitToLast(50));
            messagesUnsubscribe = onValue(messagesRef, (snapshot) => {
                chatMessages.innerHTML = '';
                const messages = snapshot.val();
                if (messages) {
                    Object.values(messages).forEach(msg => appendMessage(msg));
                    scrollToBottom();
                }
            });

            // الاستماع لحالة اللعبة
            gameUnsubscribe = onValue(ref(db, `rooms/${currentRoom}/game`), (snapshot) => {
                currentGameState = snapshot.val();
                updateGameUI();
                get(ref(db, `rooms/${currentRoom}/users`)).then(usersSnap => {
                    renderMembers(usersSnap.val());
                });
            });
        }

        async function startGameAuto(users) {
            await runTransaction(ref(db, `rooms/${currentRoom}/game`), (currentData) => {
                if (currentData && currentData.isActive) return;
                const sortedUsers = Object.entries(users).sort((a, b) => a[1].joinedAt - b[1].joinedAt);
                const firstUserId = sortedUsers[0][0];
                const randomWord = gameWords[Math.floor(Math.random() * gameWords.length)];
                const initialScores = {};
                Object.keys(users).forEach(id => initialScores[id] = 0);
                return {
                    isActive: true,
                    describerId: firstUserId,
                    describerName: users[firstUserId].name,
                    secretWord: randomWord,
                    endTime: Date.now() + 60000,
                    scores: initialScores
                };
            });

            const gameSnap = await get(ref(db, `rooms/${currentRoom}/game`));
            if (gameSnap.exists() && gameSnap.val().isActive) {
                const game = gameSnap.val();
                await push(ref(db, `rooms/${currentRoom}/messages`), {
                    senderId: 'system',
                    senderName: 'النظام',
                    text: ` بدأت اللعبة! ${game.describerName} هو الواصف الآن`,
                    isSystem: true,
                    timestamp: Date.now()
                });
            }
        }

        function renderMembers(users) {
            membersBar.innerHTML = '';
            if (!users) return;
            const scores = currentGameState?.scores || {};
            const describerId = currentGameState?.describerId;
            const sortedUsers = Object.entries(users).sort((a, b) => a[1].joinedAt - b[1].joinedAt);

            sortedUsers.forEach(([key, user]) => {
                const card = document.createElement('div');
                let classes = 'member-card';
                if (key === currentUserId) classes += ' you';
                if (key === describerId) classes += ' describer';
                card.className = classes;
                const score = scores[key] || 0;
                const name = user.name + (key === currentUserId ? ' (أنت)' : '');
                card.innerHTML = `<span class="member-name">${escapeHtml(name)}</span><span class="member-score">${score}</span>`;
                membersBar.appendChild(card);
            });
        }

        function updateGameUI() {
            if (currentGameState && currentGameState.isActive) {
                const isDescriber = currentUserId === currentGameState.describerId;
                gameStatusHeader.textContent = ` ${currentGameState.describerName} يصف كلمة الآن`;
                gameStatusHeader.classList.add('active');
                timerDisplay.classList.add('active');

                if (isDescriber) {
                    secretWordEl.textContent = currentGameState.secretWord;
                    secretWordBanner.classList.add('active');
                } else {
                    secretWordBanner.classList.remove('active');
                }

                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    const remaining = Math.max(0, Math.ceil((currentGameState.endTime - Date.now()) / 1000));
                    timerDisplay.textContent = `⏱ ${remaining}`;
                    if (remaining <= 10) {
                        timerDisplay.style.color = 'var(--neon-pink)';
                        timerDisplay.style.borderColor = 'var(--neon-pink)';
                    } else {
                        timerDisplay.style.color = 'var(--neon-pink)';
                        timerDisplay.style.borderColor = 'rgba(255, 45, 149, 0.3)';
                    }
                    if (remaining === 0) {
                        endTurn(currentGameState.describerId, currentGameState.secretWord, true);
                    }
                }, 1000);
            } else {
                if (timerInterval) clearInterval(timerInterval);
                gameStatusHeader.classList.remove('active');
                timerDisplay.classList.remove('active');
                secretWordBanner.classList.remove('active');
            }
        }

        async function endTurn(lastDescriberId, revealedWord, isTimeUp) {
            if (timerInterval) clearInterval(timerInterval);
            const msg = isTimeUp 
                ? `⏰ انتهى الوقت! الكلمة كانت: "${revealedWord}"` 
                : `🎉 إجابة صحيحة! الكلمة كانت: "${revealedWord}"`;
            
            await push(ref(db, `rooms/${currentRoom}/messages`), {
                senderId: 'system', senderName: 'النظام', text: msg, isSystem: true, timestamp: Date.now()
            });

            const usersSnap = await get(ref(db, `rooms/${currentRoom}/users`));
            const users = usersSnap.val();
            if (!users || Object.keys(users).length < 2) {
                await update(ref(db, `rooms/${currentRoom}/game`), { isActive: false });
                return;
            }

            const sortedUsers = Object.entries(users).sort((a, b) => a[1].joinedAt - b[1].joinedAt);
            const userIds = sortedUsers.map(u => u[0]);
            const currentIndex = userIds.indexOf(lastDescriberId);
            const nextIndex = currentIndex === -1 ? 0 : (currentIndex + 1) % userIds.length;
            const nextDescriberId = userIds[nextIndex];
            const nextWord = gameWords[Math.floor(Math.random() * gameWords.length)];

            await update(ref(db, `rooms/${currentRoom}/game`), {
                describerId: nextDescriberId,
                describerName: users[nextDescriberId].name,
                secretWord: nextWord,
                endTime: Date.now() + 60000
            });

            await push(ref(db, `rooms/${currentRoom}/messages`), {
                senderId: 'system', senderName: 'النظام',
                text: `🎤 الدور الآن على: ${users[nextDescriberId].name}`,
                isSystem: true, timestamp: Date.now()
            });
        }

        // 🌟🌟 الدالة المصححة - التحقق من التخمين باستخدام Transaction ذري 🌟🌟
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            // 1️⃣ إرسال الرسالة العادية أولاً
            await push(ref(db, `rooms/${currentRoom}/messages`), {
                senderId: currentUserId,
                senderName: currentUserName,
                text: text,
                timestamp: Date.now()
            });

            messageInput.value = '';
            messageInput.focus();

            // 2️⃣ التحقق من التخمين باستخدام Transaction ذري
            // هذا يضمن قراءة أحدث حالة من Firebase مباشرة (وليس من الذاكرة المحلية)
            const gameRef = ref(db, `rooms/${currentRoom}/game`);
            
            try {
                const transactionResult = await runTransaction(gameRef, (gameData) => {
                    // إذا لم توجد لعبة أو غير نشطة، لا تغيير
                    if (!gameData || !gameData.isActive) {
                        return;
                    }
                    
                    // إذا كان المرسل هو الواصف نفسه، لا نتحقق من تخمينه
                    if (currentUserId === gameData.describerId) {
                        return;
                    }
                    
                    //  المقارنة الحاسمة: نقرأ الكلمة السرية مباشرة من البيانات الحالية
                    const normalizedInput = normalizeText(text);
                    const normalizedSecret = normalizeText(gameData.secretWord);
                    
                    console.log('🔍 مقارنة التخمين:', { 
                        input: normalizedInput, 
                        secret: normalizedSecret, 
                        match: normalizedInput === normalizedSecret 
                    });
                    
                    if (normalizedInput === normalizedSecret) {
                        // ✅ إجابة صحيحة! نحدّث النقاط ونختار كلمة جديدة
                        const newScore = (gameData.scores[gameData.describerId] || 0) + 1;
                        const updatedScores = { ...gameData.scores, [gameData.describerId]: newScore };
                        
                        // اختيار كلمة جديدة مختلفة عن الحالية
                        let nextWord;
                        do {
                            nextWord = gameWords[Math.floor(Math.random() * gameWords.length)];
                        } while (nextWord === gameData.secretWord);
                        
                        console.log('✅ تم التخمين الصحيح! الكلمة الجديدة:', nextWord);
                        
                        return {
                            ...gameData,
                            scores: updatedScores,
                            secretWord: nextWord
                        };
                    }
                    
                    // إجابة خاطئة - لا تغيير
                    return;
                });

                // 3️ إذا نجح الـ Transaction (تم التخمين الصحيح)، نرسل رسالة النظام
                if (transactionResult.committed) {
                    const newGameData = transactionResult.snapshot.val();
                    const describerName = newGameData.describerName;
                    
                    await push(ref(db, `rooms/${currentRoom}/messages`), {
                        senderId: 'system',
                        senderName: 'النظام',
                        text: `🎯 إجابة صحيحة من ${currentUserName}! ${describerName} يحصل على نقطة!`,
                        isCorrect: true,
                        timestamp: Date.now()
                    });
                    
                    console.log('🎉 تم إرسال رسالة الإجابة الصحيحة');
                }
            } catch (error) {
                console.error(' خطأ في Transaction:', error);
            }
        }

        document.getElementById('send-btn').addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        function appendMessage(msg) {
            if (msg.isSystem) {
                const div = document.createElement('div');
                div.className = 'system-msg';
                div.textContent = msg.text;
                chatMessages.appendChild(div);
                return;
            }
            if (msg.isCorrect) {
                const div = document.createElement('div');
                div.className = 'correct-guess-msg';
                div.textContent = msg.text;
                chatMessages.appendChild(div);
                return;
            }
            const div = document.createElement('div');
            const isMine = msg.senderId === currentUserId;
            div.className = `message ${isMine ? 'mine' : 'other'}`;
            const time = new Date(msg.timestamp).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            div.innerHTML = `
                <div class="sender-name">${msg.senderName}</div>
                <div class="text">${escapeHtml(msg.text)}</div>
                <div class="message-time">${time}</div>
            `;
            chatMessages.appendChild(div);
        }

        function scrollToBottom() {
            setTimeout(() => { chatMessages.scrollTop = chatMessages.scrollHeight; }, 100);
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        document.getElementById('leave-btn').addEventListener('click', () => {
            if (currentRoom && currentUserId) {
                remove(ref(db, `rooms/${currentRoom}/users/${currentUserId}`));
            }
            if (usersUnsubscribe) usersUnsubscribe();
            if (messagesUnsubscribe) messagesUnsubscribe();
            if (gameUnsubscribe) gameUnsubscribe();
            if (timerInterval) clearInterval(timerInterval);
            roomScreen.style.display = 'none';
            loginScreen.style.display = 'flex';
            roomIdInput.value = '';
            chatMessages.innerHTML = '';
            membersBar.innerHTML = '';
            currentRoom = null;
            currentGameState = null;
        });
    </script>
</body>
</html>
