<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📍 موقعي الحالي</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0f0f23;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
        }

        /* البطاقة العلوية */
        .info-card {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(15, 15, 35, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 15px;
            z-index: 1000;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            max-width: 500px;
            margin: 0 auto;
        }

        .info-card h2 {
            font-size: 16px;
            color: #00d4ff;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-card h2::before {
            content: "📍";
        }

        .address {
            font-size: 14px;
            line-height: 1.6;
            color: #e0e0e0;
            min-height: 40px;
        }

        .address.loading {
            color: #888;
            font-style: italic;
        }

        .coords {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            font-size: 12px;
            color: #aaa;
        }

        .coord-box {
            background: rgba(255,255,255,0.05);
            padding: 5px 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .coord-box span {
            color: #00ff88;
            font-weight: bold;
        }

        /* زر التتبع */
        .track-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border: none;
            color: #fff;
            padding: 14px 35px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 25px rgba(0, 212, 255, 0.4);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .track-btn:active {
            transform: translateX(-50%) scale(0.95);
        }

        .track-btn.tracking {
            background: linear-gradient(135deg, #ff4757, #cc0033);
            box-shadow: 0 5px 25px rgba(255, 71, 87, 0.4);
        }

        /* مؤشر GPS */
        .gps-status {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ff4757;
            border: 2px solid #fff;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        }

        .gps-status.active {
            background: #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }

        /* شاشة التحميل */
        .splash {
            position: fixed;
            inset: 0;
            background: #0f0f23;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: opacity 0.5s;
        }

        .splash.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .splash-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 212, 255, 0.2);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .splash p {
            color: #888;
            font-size: 14px;
        }

        /* خطأ */
        .error-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #ff4757;
            color: #fff;
            padding: 12px 25px;
            border-radius: 15px;
            font-size: 14px;
            z-index: 1002;
            opacity: 0;
            transition: all 0.4s;
            white-space: nowrap;
        }

        .error-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* تخصيص Leaflet */
        .leaflet-control-zoom {
            border-radius: 15px !important;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3) !important;
        }

        .leaflet-control-zoom a {
            background: rgba(15, 15, 35, 0.9) !important;
            color: #fff !important;
            border-color: rgba(255,255,255,0.1) !important;
            width: 40px !important;
            height: 40px !important;
            line-height: 40px !important;
            font-size: 20px !important;
        }

        .leaflet-popup-content-wrapper {
            background: rgba(15, 15, 35, 0.95);
            color: #fff;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .leaflet-popup-tip {
            background: rgba(15, 15, 35, 0.95);
        }
    </style>
</head>
<body>

    <!-- شاشة التحميل -->
    <div class="splash" id="splash">
        <div class="splash-spinner"></div>
        <p>جاري تحديد موقعك...</p>
    </div>

    <!-- مؤشر GPS -->
    <div class="gps-status" id="gpsStatus"></div>

    <!-- البطاقة العلوية -->
    <div class="info-card">
        <h2>موقعك الحالي</h2>
        <div class="address loading" id="address">جاري تحديد العنوان...</div>
        <div class="coords">
            <div class="coord-box">🌍 خط العرض: <span id="lat">--</span></div>
            <div class="coord-box">🌍 خط الطول: <span id="lng">--</span></div>
        </div>
    </div>

    <!-- الخريطة -->
    <div id="map"></div>

    <!-- زر التتبع -->
    <button class="track-btn" id="trackBtn" onclick="toggleTracking()">
        🎯 تتبع موقعي
    </button>

    <!-- رسالة خطأ -->
    <div class="error-toast" id="errorToast"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ========== الإعدادات ==========
        let map, marker, circle, watchId = null;
        let isTracking = false;
        let currentPos = null;

        const splash = document.getElementById('splash');
        const addressEl = document.getElementById('address');
        const latEl = document.getElementById('lat');
        const lngEl = document.getElementById('lng');
        const gpsStatus = document.getElementById('gpsStatus');
        const trackBtn = document.getElementById('trackBtn');
        const errorToast = document.getElementById('errorToast');

        // ========== تهيئة الخريطة ==========
        function initMap(lat, lng, accuracy) {
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView([lat, lng], 18);

            // طبقة الخريطة الداكنة الجميلة
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 22,
                subdomains: 'abcd'
            }).addTo(map);

            // زوم في مكان مناسب
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // أيقونة مخصصة للموقع
            const locationIcon = L.divIcon({
                className: 'custom-marker',
                html: `<div style="
                    width:24px;height:24px;
                    background:#00d4ff;
                    border:3px solid #fff;
                    border-radius:50%;
                    box-shadow:0 0 15px rgba(0,212,255,0.6), 0 0 30px rgba(0,212,255,0.3);
                    animation:bounce 1.5s infinite;
                "></div>`,
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });

            marker = L.marker([lat, lng], { icon: locationIcon }).addTo(map);
            
            // دائرة الدقة
            circle = L.circle([lat, lng], {
                radius: accuracy || 20,
                color: '#00d4ff',
                fillColor: '#00d4ff',
                fillOpacity: 0.15,
                weight: 1
            }).addTo(map);

            // إخفاء شاشة التحميل
            setTimeout(() => splash.classList.add('hidden'), 500);
        }

        // ========== تحديث الموقع ==========
        function updatePosition(lat, lng, accuracy) {
            currentPos = { lat, lng };
            
            latEl.textContent = lat.toFixed(6);
            lngEl.textContent = lng.toFixed(6);

            if (marker) {
                marker.setLatLng([lat, lng]);
                circle.setLatLng([lat, lng]);
                circle.setRadius(accuracy || 20);
            }

            if (isTracking && map) {
                map.panTo([lat, lng], { animate: true, duration: 0.5 });
            }

            // جلب العنوان
            fetchAddress(lat, lng);
        }

        // ========== جلب العنوان (Reverse Geocoding) ==========
        async function fetchAddress(lat, lng) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=ar`);
                const data = await res.json();
                
                if (data.display_name) {
                    // تنظيف العنوان
                    const parts = data.display_name.split(', ');
                    const cleanAddress = parts.slice(0, 4).join('، ');
                    addressEl.textContent = cleanAddress;
                    addressEl.classList.remove('loading');
                }
            } catch (e) {
                addressEl.textContent = "تعذر تحديد العنوان التفصيلي";
            }
        }

        // ========== تتبع الموقع ==========
        function startTracking() {
            if (!navigator.geolocation) {
                showError("متصفحك لا يدعم تحديد الموقع");
                return;
            }

            gpsStatus.classList.add('active');

            // أول موقع
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const { latitude, longitude, accuracy } = pos.coords;
                    
                    if (!map) {
                        initMap(latitude, longitude, accuracy);
                    }
                    updatePosition(latitude, longitude, accuracy);
                },
                (err) => handleError(err),
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );

            // التتبع المستمر
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const { latitude, longitude, accuracy } = pos.coords;
                    if (!map) {
                        initMap(latitude, longitude, accuracy);
                    }
                    updatePosition(latitude, longitude, accuracy);
                },
                (err) => handleError(err),
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // ========== زر التتبع ==========
        function toggleTracking() {
            isTracking = !isTracking;
            
            if (isTracking) {
                trackBtn.classList.add('tracking');
                trackBtn.innerHTML = '⏹️ إيقاف التتبع';
                if (currentPos) {
                    map.flyTo([currentPos.lat, currentPos.lng], 18, { duration: 1 });
                }
            } else {
                trackBtn.classList.remove('tracking');
                trackBtn.innerHTML = '🎯 تتبع موقعي';
            }
        }

        // ========== أخطاء ==========
        function handleError(err) {
            let msg = "حدث خطأ في تحديد الموقع";
            switch(err.code) {
                case 1: msg = "❌ رفضت إذن الوصول للموقع"; break;
                case 2: msg = "❌ تعذر تحديد الموقع"; break;
                case 3: msg = "⏱️ انتهى الوقت"; break;
            }
            showError(msg);
            splash.classList.add('hidden');
        }

        function showError(msg) {
            errorToast.textContent = msg;
            errorToast.classList.add('show');
            setTimeout(() => errorToast.classList.remove('show'), 4000);
        }

        // ========== تشغيل ==========
        window.onload = startTracking;

        // CSS animation للماركر
        const style = document.createElement('style');
        style.textContent = `
            @keyframes bounce {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.2); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
