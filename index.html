<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📍 موقعي بالضبط</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #050510;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
        }

        .info-card {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(5, 5, 16, 0.96);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 16px;
            z-index: 1000;
            border: 1px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            max-width: 500px;
            margin: 0 auto;
        }

        .info-card h2 {
            font-size: 17px;
            color: #00d4ff;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .address {
            font-size: 14px;
            line-height: 1.6;
            color: #e0e0e0;
            min-height: 40px;
        }

        .address.loading { color: #888; font-style: italic; }

        .coords {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            font-size: 12px;
            flex-wrap: wrap;
        }

        .coord-box {
            background: rgba(0, 212, 255, 0.08);
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid rgba(0, 212, 255, 0.1);
            font-family: monospace;
        }

        .coord-box span { color: #00ff88; font-weight: bold; }

        .accuracy-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .accuracy-badge.ip {
            background: rgba(255, 170, 0, 0.15);
            color: #ffaa00;
            border: 1px solid rgba(255, 170, 0, 0.3);
        }

        .accuracy-badge.gps {
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .accuracy-badge.ip .dot { background: #ffaa00; box-shadow: 0 0 8px #ffaa00; }
        .accuracy-badge.gps .dot { background: #00ff88; box-shadow: 0 0 8px #00ff88; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        .gps-btn {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: linear-gradient(135deg, #00d4ff, #0066cc);
            border: none;
            color: #fff;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 25px rgba(0, 212, 255, 0.35);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .gps-btn:active { transform: translateX(-50%) scale(0.95); }
        .gps-btn.hidden { display: none; }

        .splash {
            position: fixed; inset: 0;
            background: #050510;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: opacity 0.5s;
        }

        .splash.hidden { opacity: 0; pointer-events: none; }

        .splash-spinner {
            width: 55px; height: 55px;
            border: 4px solid rgba(0, 212, 255, 0.15);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .splash p { color: #888; font-size: 14px; text-align: center; padding: 0 30px; }

        .error-toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #ff4757;
            color: #fff;
            padding: 12px 22px;
            border-radius: 15px;
            font-size: 13px;
            z-index: 1002;
            opacity: 0;
            transition: all 0.4s;
            text-align: center;
            max-width: 90%;
        }

        .error-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .leaflet-control-zoom {
            border-radius: 15px !important;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3) !important;
        }

        .leaflet-control-zoom a {
            background: rgba(5, 5, 16, 0.9) !important;
            color: #fff !important;
            border-color: rgba(0,212,255,0.2) !important;
            width: 42px !important;
            height: 42px !important;
            line-height: 42px !important;
            font-size: 20px !important;
        }

        .note {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.05);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 11px;
            color: #888;
            z-index: 1000;
            text-align: center;
            max-width: 90%;
        }
    </style>
<base target="_blank">
</head>
<body>

    <div class="splash" id="splash">
        <div class="splash-spinner"></div>
        <p id="splashText">جاري تحديد موقعك...</p>
    </div>

    <div class="info-card">
        <h2>📍 موقعك الحالي</h2>
        <div class="address loading" id="address">جاري تحديد العنوان...</div>
        <div class="coords">
            <div class="coord-box">خط العرض: <span id="lat">--</span></div>
            <div class="coord-box">خط الطول: <span id="lng">--</span></div>
        </div>
        <div class="accuracy-badge ip" id="accBadge">
            <div class="dot"></div>
            <span id="accText">موقع تقريبي من شبكة الإنترنت</span>
        </div>
    </div>

    <div id="map"></div>

    <div class="note" id="note">
        ⚠️ الموقع التقريبي قد يفرق كيلومتر حسب شبكة الإنترنت
    </div>

    <button class="gps-btn" id="gpsBtn" onclick="enableGPS()">
        🎯 دقة عالية (GPS) - اضغط هنا
    </button>

    <div class="error-toast" id="errorToast"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map, marker, circle, watchId;
        let hasGPS = false;

        const splash = document.getElementById('splash');
        const splashText = document.getElementById('splashText');
        const addressEl = document.getElementById('address');
        const latEl = document.getElementById('lat');
        const lngEl = document.getElementById('lng');
        const accBadge = document.getElementById('accBadge');
        const accText = document.getElementById('accText');
        const gpsBtn = document.getElementById('gpsBtn');
        const note = document.getElementById('note');
        const errorToast = document.getElementById('errorToast');

        function initMap(lat, lng, zoom, accuracy) {
            if (!map) {
                map = L.map('map', { zoomControl: false, attributionControl: false });
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    maxZoom: 22, subdomains: 'abcd'
                }).addTo(map);
                L.control.zoom({ position: 'bottomright' }).addTo(map);
            }

            map.setView([lat, lng], zoom);

            const icon = L.divIcon({
                className: 'custom-marker',
                html: `<div style="width:24px;height:24px;background:#00d4ff;border:3px solid #fff;border-radius:50%;box-shadow:0 0 20px rgba(0,212,255,0.7);"></div>`,
                iconSize: [24, 24], iconAnchor: [12, 12]
            });

            if (marker) { marker.setLatLng([lat, lng]); }
            else { marker = L.marker([lat, lng], { icon }).addTo(map); }

            if (circle) {
                circle.setLatLng([lat, lng]);
                circle.setRadius(accuracy);
            } else {
                circle = L.circle([lat, lng], {
                    radius: accuracy, color: '#00d4ff',
                    fillColor: '#00d4ff', fillOpacity: 0.15, weight: 1.5
                }).addTo(map);
            }
        }

        function updateUI(lat, lng, accuracy, isGPS) {
            latEl.textContent = lat.toFixed(6);
            lngEl.textContent = lng.toFixed(6);

            if (isGPS && !hasGPS) {
                hasGPS = true;
                accBadge.className = 'accuracy-badge gps';
                accText.textContent = `دقة: ±${Math.round(accuracy)} متر (GPS)`;
                note.style.display = 'none';
                gpsBtn.classList.add('hidden');
                splashText.textContent = "تم تحديد موقعك بدقة! 🎯";
            } else if (!isGPS) {
                accText.textContent = `دقة: ~${Math.round(accuracy/1000)} كم (تقريبي)`;
            }

            fetchAddress(lat, lng);
        }

        async function fetchAddress(lat, lng) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=ar`, {
                    headers: { 'User-Agent': 'MyLocationApp/1.0' }
                });
                const data = await res.json();
                if (data.display_name) {
                    const parts = data.display_name.split(', ');
                    addressEl.textContent = parts.slice(0, 4).join('، ');
                    addressEl.classList.remove('loading');
                }
            } catch (e) {
                addressEl.textContent = "تعذر تحديد العنوان";
            }
        }

        // ========== 1. جرب GPS silently (لو سمحتله قبل كده) ==========
        function tryGPSSilently() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) { resolve(false); return; }

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const { latitude, longitude, accuracy } = pos.coords;
                        initMap(latitude, longitude, 18, accuracy);
                        updateUI(latitude, longitude, accuracy, true);
                        startWatching();
                        resolve(true);
                    },
                    () => { resolve(false); }, // رفض أو مش متاح → نكمل لـ IP
                    { enableHighAccuracy: true, timeout: 4000, maximumAge: 60000 }
                );
            });
        }

        // ========== 2. IP Location (بدون إذن) ==========
        async function getIPLocation() {
            try {
                // API أحسن شوية
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();

                if (data.latitude && data.longitude) {
                    const accuracy = data.region ? 2000 : 10000;
                    initMap(data.latitude, data.longitude, 14, accuracy);
                    updateUI(data.latitude, data.longitude, accuracy, false);
                    setTimeout(() => splash.classList.add('hidden'), 500);
                } else {
                    throw new Error('No data');
                }
            } catch (e) {
                // Fallback تاني
                try {
                    const res2 = await fetch('https://ip-api.com/json/?fields=lat,lon,city,country');
                    const data2 = await res2.json();
                    initMap(data2.lat, data2.lon, 13, 5000);
                    updateUI(data2.lat, data2.lon, 5000, false);
                } catch (e2) {
                    // افتراضي: القاهرة
                    initMap(30.0444, 31.2357, 12, 20000);
                    updateUI(30.0444, 31.2357, 20000, false);
                    showError("تعذر تحديد الموقع تلقائيًا");
                }
                setTimeout(() => splash.classList.add('hidden'), 500);
            }
        }

        // ========== 3. GPS بالزر (لما المستخدم يختار) ==========
        function enableGPS() {
            if (!navigator.geolocation) {
                showError("المتصفح لا يدعم GPS");
                return;
            }

            gpsBtn.innerHTML = "⏳ جاري التحميل...";
            splash.classList.remove('hidden');
            splashText.textContent = "جاري تحديد موقعك بالGPS...";

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const { latitude, longitude, accuracy } = pos.coords;
                    initMap(latitude, longitude, 18, accuracy);
                    updateUI(latitude, longitude, accuracy, true);
                    startWatching();
                    setTimeout(() => splash.classList.add('hidden'), 600);
                },
                (err) => {
                    splash.classList.add('hidden');
                    gpsBtn.innerHTML = "🎯 دقة عالية (GPS) - اضغط هنا";
                    let msg = "❌ لازم تسمح بالوصول للموقع من إعدادات المتصفح";
                    if (err.code === 2) msg = "❌ تعذر الوصول للـ GPS";
                    if (err.code === 3) msg = "⏱️ الـ GPS بطيء، جرب في مكان مفتوح";
                    showError(msg);
                },
                { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
            );
        }

        // ========== تتبع مستمر ==========
        function startWatching() {
            if (watchId) return;
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const { latitude, longitude, accuracy } = pos.coords;
                    if (marker) {
                        marker.setLatLng([latitude, longitude]);
                        circle.setLatLng([latitude, longitude]);
                        circle.setRadius(accuracy);
                    }
                    if (map) map.panTo([latitude, longitude], { animate: true, duration: 0.5 });
                    latEl.textContent = latitude.toFixed(6);
                    lngEl.textContent = longitude.toFixed(6);
                    accText.textContent = `دقة: ±${Math.round(accuracy)} متر (GPS)`;
                },
                () => {},
                { enableHighAccuracy: true, maximumAge: 0 }
            );
        }

        function showError(msg) {
            errorToast.textContent = msg;
            errorToast.classList.add('show');
            setTimeout(() => errorToast.classList.remove('show'), 5000);
        }

        // ========== تشغيل ==========
        async function start() {
            const gpsWorked = await tryGPSSilently();
            if (!gpsWorked) {
                await getIPLocation();
            } else {
                setTimeout(() => splash.classList.add('hidden'), 600);
            }
        }

        window.onload = start;
    </script>
</body>
</html>
