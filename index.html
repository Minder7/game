<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📍 موقعي</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #050510;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* ===== شاشة الترحيب ===== */
        .welcome-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, #0a0a20 0%, #050510 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: all 0.8s ease;
            padding: 20px;
        }
        .welcome-screen.hidden {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }
        .welcome-icon {
            font-size: 70px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 25px rgba(0,212,255,0.3));
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        .welcome-title {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .welcome-sub {
            font-size: 14px;
            color: #888;
            text-align: center;
            max-width: 300px;
            line-height: 1.7;
        }
        .welcome-btn {
            background: linear-gradient(135deg, #00d4ff, #0066cc);
            border: none;
            color: #fff;
            padding: 16px 55px;
            border-radius: 35px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 30px rgba(0,212,255,0.35);
            transition: all 0.3s;
            margin-top: 10px;
        }
        .welcome-btn:active { transform: scale(0.95); }
        .welcome-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ===== الخريطة ===== */
        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
            opacity: 0;
            transition: opacity 1s ease;
        }
        #map.visible { opacity: 1; }

        /* ===== البطاقة ===== */
        .location-card {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            background: rgba(5, 5, 16, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 18px 20px;
            z-index: 1000;
            border: 1px solid rgba(0, 212, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            max-width: 500px;
            margin: 0 auto;
            transform: translateY(-130%);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .location-card.show { transform: translateY(0); }

        .loc-label {
            font-size: 11px;
            color: #00d4ff;
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .loc-place {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            line-height: 1.4;
        }
        .loc-area {
            font-size: 13px;
            color: #aaa;
            margin-top: 4px;
        }
        .loc-loading { color: #888; font-style: italic; font-size: 14px; }

        .acc-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }
        .acc-pill.gps {
            background: rgba(0, 255, 136, 0.12);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.25);
        }
        .acc-pill.ip {
            background: rgba(255, 170, 0, 0.12);
            color: #ffaa00;
            border: 1px solid rgba(255, 170, 0, 0.25);
        }
        .acc-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        .acc-pill.gps .acc-dot { background: #00ff88; box-shadow: 0 0 8px #00ff88; }
        .acc-pill.ip .acc-dot { background: #ffaa00; box-shadow: 0 0 8px #ffaa00; }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        /* ===== زر إعادة المحاولة ===== */
        .retry-btn {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            z-index: 1000;
            background: linear-gradient(135deg, #ff4757, #cc0033);
            border: none;
            color: #fff;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 25px rgba(255, 71, 87, 0.3);
            transition: all 0.4s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .retry-btn.show { transform: translateX(-50%) translateY(0); }
        .retry-btn:active { transform: translateX(-50%) scale(0.95); }
        .retry-btn.hidden { display: none; }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255, 170, 0, 0.95);
            color: #000;
            padding: 12px 20px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
            z-index: 1002;
            opacity: 0;
            transition: all 0.4s;
            text-align: center;
            max-width: 90%;
            backdrop-filter: blur(10px);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            background: rgba(255, 71, 87, 0.95);
            color: #fff;
        }

        /* ===== Leaflet ===== */
        .leaflet-control-zoom {
            border-radius: 15px !important;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3) !important;
        }
        .leaflet-control-zoom a {
            background: rgba(5, 5, 16, 0.9) !important;
            color: #fff !important;
            border-color: rgba(0,212,255,0.2) !important;
            width: 42px !important;
            height: 42px !important;
            line-height: 42px !important;
            font-size: 20px !important;
        }
    </style>
</head>
<body>

    <!-- شاشة الترحيب -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-icon">🌍</div>
        <div class="welcome-title">مرحباً بك</div>
        <div class="welcome-sub">
            اضغط "أهلاً" لتحديد موقعك بدقة القرية والشارع على الخريطة
        </div>
        <button class="welcome-btn" id="welcomeBtn" onclick="startApp()">
            أهلاً 👋
        </button>
    </div>

    <!-- البطاقة -->
    <div class="location-card" id="locCard">
        <div class="loc-label">📍 أنت الآن في</div>
        <div class="loc-place loc-loading" id="placeName">جاري تحديد الموقع...</div>
        <div class="loc-area" id="areaName"></div>
        <div class="acc-pill gps" id="accPill" style="display:none;">
            <div class="acc-dot"></div>
            <span id="accText">جاري التحميل...</span>
        </div>
    </div>

    <!-- الخريطة -->
    <div id="map"></div>

    <!-- زر إعادة المحاولة -->
    <button class="retry-btn" id="retryBtn" onclick="requestGPS()">
        🎯 حدد موقعي بالضبط (GPS)
    </button>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, marker, circle, watchId;
        let hasGPS = false;

        const welcomeScreen = document.getElementById('welcomeScreen');
        const welcomeBtn = document.getElementById('welcomeBtn');
        const mapEl = document.getElementById('map');
        const locCard = document.getElementById('locCard');
        const placeName = document.getElementById('placeName');
        const areaName = document.getElementById('areaName');
        const accPill = document.getElementById('accPill');
        const accText = document.getElementById('accText');
        const retryBtn = document.getElementById('retryBtn');
        const toast = document.getElementById('toast');

        // ===== لما يدوس "أهلاً" =====
        function startApp() {
            welcomeBtn.innerHTML = "⏳ جاري التحميل...";
            welcomeBtn.disabled = true;

            // 🎯 أولوية قصوى: GPS فوراً
            requestGPS();
        }

        // ===== طلب GPS =====
        function requestGPS() {
            if (!navigator.geolocation) {
                showToast("❌ المتصفح لا يدعم تحديد الموقع", true);
                fallbackIP();
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    // ✅ نجاح! المستخدم وافق (أو مسموح قبل كده)
                    const { latitude, longitude, accuracy } = pos.coords;
                    hasGPS = true;
                    showMap(latitude, longitude, 18, accuracy, true);
                    startWatching();
                },
                (err) => {
                    // ❌ فشل (رفض أو مش متاح)
                    handleGPSFail(err);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // ===== GPS فشل =====
        function handleGPSFail(err) {
            let msg = "";
            if (err.code === 1) {
                msg = "⚠️ لازم تسمح بالموقع من إعدادات المتصفح للدقة العالية";
            } else if (err.code === 2) {
                msg = "⚠️ الـ GPS مش متاح حالياً";
            } else if (err.code === 3) {
                msg = "⚠️ الـ GPS بطيء، تأكد إنك في مكان مفتوح";
            }
            showToast(msg, true);

            // نروح لـ IP كـ fallback
            fallbackIP();
        }

        // ===== IP Fallback =====
        async function fallbackIP() {
            let lat, lng, accuracy = 5000;

            try {
                const res = await fetch('https://ip-api.com/json/?fields=lat,lon,city,region,country');
                const data = await res.json();
                lat = data.lat;
                lng = data.lon;
                accuracy = 4000;
            } catch (e) {
                try {
                    const res2 = await fetch('https://ipwho.is/');
                    const data2 = await res2.json();
                    if (data2.success) {
                        lat = data2.latitude;
                        lng = data2.longitude;
                        accuracy = 4000;
                    } else throw new Error();
                } catch (e2) {
                    // افتراضي: القاهرة
                    lat = 30.0444;
                    lng = 31.2357;
                    accuracy = 20000;
                }
            }

            showMap(lat, lng, 13, accuracy, false);

            // نظهر زر "حدد موقعي بالضبط" عشان المستخدم يعيد المحاولة
            setTimeout(() => retryBtn.classList.add('show'), 800);

            showToast("⚠️ الموقع تقريبي - اضغط الزر الأحمر لتحديد موقعك بالضبط");
        }

        // ===== تهيئة الخريطة =====
        function initMap(lat, lng, zoom, accuracy) {
            if (!map) {
                map = L.map('map', { zoomControl: false, attributionControl: false });
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    maxZoom: 22, subdomains: 'abcd'
                }).addTo(map);
                L.control.zoom({ position: 'bottomright' }).addTo(map);
            }
            map.setView([lat, lng], zoom);

            const icon = L.divIcon({
                className: 'custom-marker',
                html: `<div style="width:26px;height:26px;background:#00d4ff;border:3px solid #fff;border-radius:50%;box-shadow:0 0 20px rgba(0,212,255,0.7);"></div>`,
                iconSize: [26, 26], iconAnchor: [13, 13]
            });

            if (marker) marker.setLatLng([lat, lng]);
            else marker = L.marker([lat, lng], { icon }).addTo(map);

            if (circle) {
                circle.setLatLng([lat, lng]);
                circle.setRadius(accuracy);
            } else {
                circle = L.circle([lat, lng], {
                    radius: accuracy, color: '#00d4ff',
                    fillColor: '#00d4ff', fillOpacity: 0.12, weight: 1.5
                }).addTo(map);
            }
        }

        // ===== عرض الخريطة =====
        function showMap(lat, lng, zoom, accuracy, isGPS) {
            welcomeScreen.classList.add('hidden');
            mapEl.classList.add('visible');
            initMap(lat, lng, zoom, accuracy);

            // تحديث البطاقة
            accPill.style.display = 'inline-flex';
            if (isGPS) {
                accPill.className = 'acc-pill gps';
                accText.textContent = `دقة عالية ±${Math.round(accuracy)} متر`;
                retryBtn.classList.remove('show');
            } else {
                accPill.className = 'acc-pill ip';
                accText.textContent = `تقريبي ~${Math.round(accuracy/1000)} كم`;
            }

            fetchAddress(lat, lng);
            setTimeout(() => locCard.classList.add('show'), 300);
        }

        // ===== جلب العنوان =====
        async function fetchAddress(lat, lng) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=ar`, {
                    headers: { 'User-Agent': 'MyLocationApp/1.0' }
                });
                const data = await res.json();
                if (data.display_name) {
                    const parts = data.display_name.split(', ');
                    placeName.textContent = parts[0] || 'موقع غير معروف';
                    placeName.classList.remove('loc-loading');
                    areaName.textContent = parts.slice(1, 4).join('، ');
                }
            } catch (e) {
                placeName.textContent = "تعذر تحديد العنوان";
            }
        }

        // ===== تتبع مستمر =====
        function startWatching() {
            if (watchId) return;
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const { latitude, longitude, accuracy } = pos.coords;
                    if (marker) {
                        marker.setLatLng([latitude, longitude]);
                        circle.setLatLng([latitude, longitude]);
                        circle.setRadius(accuracy);
                    }
                    if (map) map.panTo([latitude, longitude], { animate: true, duration: 0.5 });
                    accText.textContent = `دقة عالية ±${Math.round(accuracy)} متر`;
                    fetchAddress(latitude, longitude);
                },
                () => {},
                { enableHighAccuracy: true, maximumAge: 0 }
            );
        }

        // ===== Toast =====
        function showToast(msg, isError) {
            toast.textContent = msg;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 6000);
        }
    </script>
</body>
</html>
