<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📍 موقعي الحالي</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0a0a1a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
        }

        /* البطاقة العلوية */
        .info-card {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 16px;
            z-index: 1000;
            border: 1px solid rgba(0, 212, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            max-width: 500px;
            margin: 0 auto;
        }

        .info-card h2 {
            font-size: 16px;
            color: #00d4ff;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .address {
            font-size: 14px;
            line-height: 1.6;
            color: #e8e8e8;
            min-height: 40px;
        }

        .address.loading {
            color: #888;
            font-style: italic;
        }

        .coords {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            font-size: 12px;
            flex-wrap: wrap;
        }

        .coord-box {
            background: rgba(0, 212, 255, 0.08);
            padding: 6px 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid rgba(0, 212, 255, 0.1);
        }

        .coord-box span {
            color: #00ff88;
            font-weight: bold;
            font-family: monospace;
        }

        /* شريط الحالة */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 11px;
            color: #aaa;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffaa00;
            box-shadow: 0 0 8px rgba(255, 170, 0, 0.5);
            animation: pulse 2s infinite;
        }

        .status-dot.accurate {
            background: #00ff88;
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }

        /* زر الدقة العالية */
        .accuracy-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: linear-gradient(135deg, #00d4ff, #0066aa);
            border: none;
            color: #fff;
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 25px rgba(0, 212, 255, 0.3);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .accuracy-btn:active {
            transform: translateX(-50%) scale(0.95);
        }

        .accuracy-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* شاشة التحميل */
        .splash {
            position: fixed;
            inset: 0;
            background: #0a0a1a;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: opacity 0.6s;
        }

        .splash.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .splash-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 212, 255, 0.15);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .splash p {
            color: #888;
            font-size: 14px;
        }

        /* خطأ */
        .error-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #ff4757;
            color: #fff;
            padding: 12px 25px;
            border-radius: 15px;
            font-size: 14px;
            z-index: 1002;
            opacity: 0;
            transition: all 0.4s;
            white-space: nowrap;
        }

        .error-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Leaflet custom */
        .leaflet-control-zoom {
            border-radius: 15px !important;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3) !important;
        }

        .leaflet-control-zoom a {
            background: rgba(10, 10, 26, 0.9) !important;
            color: #fff !important;
            border-color: rgba(0,212,255,0.2) !important;
            width: 40px !important;
            height: 40px !important;
            line-height: 40px !important;
            font-size: 20px !important;
        }

        .leaflet-popup-content-wrapper {
            background: rgba(10, 10, 26, 0.95);
            color: #fff;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .leaflet-popup-tip {
            background: rgba(10, 10, 26, 0.95);
        }
    </style>
</head>
<body>

    <!-- شاشة التحميل -->
    <div class="splash" id="splash">
        <div class="splash-spinner"></div>
        <p>جاري تحديد موقعك من IP...</p>
    </div>

    <!-- البطاقة العلوية -->
    <div class="info-card">
        <h2>📍 موقعك الحالي</h2>
        <div class="address loading" id="address">جاري تحديد العنوان...</div>
        <div class="coords">
            <div class="coord-box">🌍 خط العرض: <span id="lat">--</span></div>
            <div class="coord-box">🌍 خط الطول: <span id="lng">--</span></div>
        </div>
        <div class="status-bar">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">موقع تقريبي من IP</span>
        </div>
    </div>

    <!-- الخريطة -->
    <div id="map"></div>

    <!-- زر الدقة العالية -->
    <button class="accuracy-btn" id="accBtn" onclick="getAccurateLocation()">
        🎯 دقة أعلى (GPS)
    </button>

    <!-- رسالة خطأ -->
    <div class="error-toast" id="errorToast"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ========== المتغيرات ==========
        let map, marker, circle;
        let currentLat = null, currentLng = null;
        let isAccurate = false;

        const splash = document.getElementById('splash');
        const addressEl = document.getElementById('address');
        const latEl = document.getElementById('lat');
        const lngEl = document.getElementById('lng');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const accBtn = document.getElementById('accBtn');
        const errorToast = document.getElementById('errorToast');

        // ========== تهيئة الخريطة ==========
        function initMap(lat, lng, accuracy) {
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView([lat, lng], 15);

            // خريطة داكنة جميلة
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 22,
                subdomains: 'abcd'
            }).addTo(map);

            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // ماركر مخصص
            const locationIcon = L.divIcon({
                className: 'custom-marker',
                html: `<div style="
                    width:22px;height:22px;
                    background:#00d4ff;
                    border:3px solid #fff;
                    border-radius:50%;
                    box-shadow:0 0 15px rgba(0,212,255,0.6), 0 0 30px rgba(0,212,255,0.2);
                "></div>`,
                iconSize: [22, 22],
                iconAnchor: [11, 11]
            });

            marker = L.marker([lat, lng], { icon: locationIcon }).addTo(map);
            
            circle = L.circle([lat, lng], {
                radius: accuracy || 5000,
                color: '#00d4ff',
                fillColor: '#00d4ff',
                fillOpacity: 0.12,
                weight: 1.5
            }).addTo(map);

            setTimeout(() => splash.classList.add('hidden'), 600);
        }

        // ========== تحديث الموقع ==========
        function updatePosition(lat, lng, accuracy, accurate) {
            currentLat = lat;
            currentLng = lng;
            
            latEl.textContent = lat.toFixed(6);
            lngEl.textContent = lng.toFixed(6);

            if (marker) {
                marker.setLatLng([lat, lng]);
                circle.setLatLng([lat, lng]);
                circle.setRadius(accuracy || 5000);
            }

            if (map) {
                map.flyTo([lat, lng], accurate ? 18 : 14, { duration: 1.5 });
            }

            // تحديث الحالة
            if (accurate) {
                isAccurate = true;
                statusDot.classList.add('accurate');
                statusText.textContent = "موقع دقيق (GPS)";
                accBtn.innerHTML = "✅ دقة عالية مفعلة";
                accBtn.disabled = true;
            }

            fetchAddress(lat, lng);
        }

        // ========== جلب العنوان ==========
        async function fetchAddress(lat, lng) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=ar`, {
                    headers: { 'User-Agent': 'MyLocationApp/1.0' }
                });
                const data = await res.json();
                
                if (data.display_name) {
                    const parts = data.display_name.split(', ');
                    const cleanAddress = parts.slice(0, 5).join('، ');
                    addressEl.textContent = cleanAddress;
                    addressEl.classList.remove('loading');
                }
            } catch (e) {
                addressEl.textContent = "تعذر تحديد العنوان التفصيلي";
            }
        }

        // ========== الموقع من IP (بدون إذن!) ==========
        async function getLocationFromIP() {
            try {
                // API مجاني - بيجيب الموقع من IP بدون أي إذن
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();

                if (data.latitude && data.longitude) {
                    const lat = data.latitude;
                    const lng = data.longitude;
                    
                    initMap(lat, lng, 5000);
                    updatePosition(lat, lng, 5000, false);
                    
                    // تحديث نص الحالة
                    statusText.textContent = `موقع تقريبي - ${data.city || ''}, ${data.country_name || ''}`;
                } else {
                    throw new Error('No location data');
                }
            } catch (err) {
                // لو فشل، نستخدم fallback
                fallbackLocation();
            }
        }

        // ========== Fallback (موقع افتراضي) ==========
        function fallbackLocation() {
            // القاهرة كموقع افتراضي
            const lat = 30.0444;
            const lng = 31.2357;
            initMap(lat, lng, 10000);
            updatePosition(lat, lng, 10000, false);
            statusText.textContent = "موقع افتراضي (القاهرة)";
            showError("تعذر تحديد الموقع تلقائيًا");
        }

        // ========== الدقة العالية (بيطلب إذن بس بزر) ==========
        function getAccurateLocation() {
            if (!navigator.geolocation) {
                showError("متصفحك لا يدعم GPS");
                return;
            }

            accBtn.innerHTML = "⏳ جاري التحميل...";
            accBtn.disabled = true;

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const { latitude, longitude, accuracy } = pos.coords;
                    updatePosition(latitude, longitude, accuracy, true);
                },
                (err) => {
                    accBtn.innerHTML = "🎯 دقة أعلى (GPS)";
                    accBtn.disabled = false;
                    let msg = "❌ رفضت الإذن";
                    if (err.code === 2) msg = "❌ تعذر تحديد الموقع";
                    if (err.code === 3) msg = "⏱️ انتهى الوقت";
                    showError(msg);
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        // ========== أخطاء ==========
        function showError(msg) {
            errorToast.textContent = msg;
            errorToast.classList.add('show');
            setTimeout(() => errorToast.classList.remove('show'), 4000);
        }

        // ========== تشغيل ==========
        window.onload = getLocationFromIP;
    </script>
</body>
</html>
